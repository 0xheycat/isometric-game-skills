<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isometric Game Skills — Live Demo</title>
<style>
  :root{ --gold:#f5b45a; --ink:#0a0a0f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#0a0a0f; color:#f5f3ef; font-family:system-ui,Segoe UI,Arial,sans-serif; overflow:hidden; }
  #c{ display:block; width:100vw; height:100vh; cursor:grab; }
  #c:active{ cursor:grabbing; }
  .panel{ position:fixed; backdrop-filter:blur(8px); background:rgba(17,17,24,.72);
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:14px 16px; }
  #hud{ top:16px; left:16px; max-width:300px; }
  #hud h1{ font-size:16px; letter-spacing:.3px; }
  #hud h1 span{ color:var(--gold); }
  #hud p{ font-size:12px; color:#b5b2ac; margin-top:6px; line-height:1.5; }
  #hud .skills{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  #hud .skills b{ font-weight:600; font-size:10.5px; color:#0a0a0f; background:var(--gold);
    padding:3px 7px; border-radius:999px; }
  #stats{ top:16px; right:16px; font-size:12px; color:#b5b2ac; }
  #stats b{ color:#f5f3ef; }
  /* control bar */
  #controls{ bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:10px 12px; }
  #controls button{ font:inherit; font-size:12.5px; color:#f5f3ef; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:10px; padding:8px 12px; transition:.15s; }
  #controls button:hover{ background:rgba(245,180,90,.18); border-color:var(--gold); }
  #controls button.on{ background:var(--gold); color:#0a0a0f; border-color:var(--gold); font-weight:600; }
  #help{ bottom:16px; right:16px; font-size:11.5px; color:#b5b2ac; text-align:right; }
  kbd{ background:rgba(255,255,255,.1); border-radius:5px; padding:1px 6px; font-size:11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="panel">
  <h1>🏔️ Isometric <span>Live Demo</span></h1>
  <p>A real Canvas2D isometric renderer in one file — no engine, no dependencies. Every technique here comes from a skill in this repo.</p>
  <div class="skills">
    <b>grid-math</b><b>renderer</b><b>depth-sort</b><b>autotiling</b><b>tile-picking</b><b>camera</b>
  </div>
</div>

<div id="stats" class="panel">
  Tile: <b id="tile">—</b> &nbsp;|&nbsp; <b id="zoom">1.00x</b> &nbsp;|&nbsp; <b id="fps">0</b> fps
</div>

<div id="controls" class="panel">
  <button id="btnRegen">🔄 Regenerate</button>
  <button id="btnGrid">▦ Grid</button>
  <button id="btnCoords"># Coords</button>
  <button id="btnReset">⌖ Reset view</button>
  <button id="btnSprite">🖼️ Sprites</button>
</div>

<div id="help" class="panel" style="bottom:70px;">
  <kbd>drag</kbd> pan &nbsp; <kbd>wheel</kbd> zoom &nbsp; <kbd>hover</kbd> pick
</div>

const IMG = {}; let spritesReady = false, spriteMode = false, _loaded = 0;
const _keys = Object.keys(SPRITE_SRC);
for(const k of _keys){
  const im = new Image();
  im.onload = ()=>{ if(++_loaded === _keys.length) spritesReady = true; };
  im.src = SPRITE_SRC[k]; IMG[k] = im;
}

// ---- Grid math (skill: isometric-grid-math) -------------------------
const W = 64, H = 32, T = 12;        // tile width, height (2:1), block thickness
const MAP = 18;                      // map size MAP x MAP

function gridToScreen(col, row){
  return { x:(col - row) * (W/2), y:(col + row) * (H/2) };
}
function screenToGrid(x, y){         // inverse transform (for picking)
  const col = (x/(W/2) + y/(H/2)) / 2;
  const row = (y/(H/2) - x/(W/2)) / 2;
  return { col:Math.floor(col), row:Math.floor(row) };
}

// ---- Procedural terrain (skill: tilemap-data-format) ----------------
// Tile types: 0 water, 1 sand, 2 grass, 3 road (dirt path), 4 field, 5 bare ground (dirt / tanah)
let seed = 0;
function noise(x, y){
  const s = seed;
  return (Math.sin(x*0.7+s)+Math.cos(y*0.6-s)+Math.sin((x+y)*0.35+s)+Math.cos((x-y)*0.5))/4;
}
let ground = [], objects = [], objAt = {};
function generate(){
  ground = []; objects = []; objAt = {};
  for(let r=0;r<MAP;r++){ ground[r]=[]; for(let c=0;c<MAP;c++){
    const n = noise(c, r);
    let t = 2;
    if(n < -0.55) t = 0;            // water
    else if(n < -0.35) t = 1;       // sand near water
    else if(n > 0.5) t = 4;         // field on high ground
    else if(n > 0.3) t = 5;         // bare ground (dirt / tanah)
    ground[r][c] = t;
  }}
  for(let c=0;c<MAP;c++){ const r = Math.round(MAP/2 + Math.sin(c*0.5+seed)*2); if(ground[r] && ground[r][c]!==0) ground[r][c]=3; }
  for(let r=0;r<MAP;r++) for(let c=0;c<MAP;c++){
    const t = ground[r][c];
    if((t===2||t===4) && Math.random()<0.12){
      const roll = Math.random();
      objects.push({ col:c, row:r, kind: roll<0.55?'tree' : roll<0.8?'rock' : 'house' });
    }
  }
  for(const o of objects) objAt[o.row+'_'+o.col]=o;
}

// ---- Palette --------------------------------------------------------
const TILE = {
  0:{top:'#4f9ad6', l:'#2f6fa8', r:'#3f86c4'},   // water
  1:{top:'#e6d2a0', l:'#bda674', r:'#d3bd8a'},   // sand
  2:{top:'#7cc36b', l:'#4f9a4a', r:'#69b15a'},   // grass
  3:{top:'#c8a877', l:'#9c8050', r:'#b59866'},   // dirt path
  4:{top:'#caa24a', l:'#9a7a2f', r:'#b58f3c'},   // field
  5:{top:'#a9763f', l:'#6f4a28', r:'#8c5c30'},   // bare ground (dirt / tanah)
};

// ---- State + camera (skill: camera-pan-zoom-controls) ---------------
const cam = { x:0, y:0, zoom:1 };
let dragging=false, lastX=0, lastY=0;
let mouseX=0, mouseY=0, hover=null;
let showGrid=false, showCoords=false;

function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
addEventListener('resize', resize); resize();
function resetView(){
  cam.zoom=1;
  const c0=gridToScreen(0,0), cN=gridToScreen(MAP-1,MAP-1);
  cam.x = (c0.x+cN.x)/2; cam.y=(c0.y+cN.y)/2;
}
resetView();

canvas.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('mouseup', ()=> dragging=false);
addEventListener('mousemove', e=>{
  mouseX=e.clientX; mouseY=e.clientY;
  if(dragging){ cam.x -= (e.clientX-lastX)/cam.zoom; cam.y -= (e.clientY-lastY)/cam.zoom; lastX=e.clientX; lastY=e.clientY; }
});
canvas.addEventListener('wheel', e=>{ e.preventDefault();
  const f = e.deltaY<0 ? 1.1 : 1/1.1;
  cam.zoom = Math.min(2.5, Math.max(0.4, cam.zoom*f));
}, {passive:false});

// ---- Controls -------------------------------------------------------
const bGrid=document.getElementById('btnGrid'), bCoords=document.getElementById('btnCoords');
document.getElementById('btnRegen').onclick = ()=>{ seed += 1.7; generate(); };
bGrid.onclick   = ()=>{ showGrid=!showGrid; bGrid.classList.toggle('on', showGrid); };
bCoords.onclick = ()=>{ showCoords=!showCoords; bCoords.classList.toggle('on', showCoords); };
document.getElementById('btnReset').onclick = resetView;
const bSprite = document.getElementById('btnSprite');
bSprite.onclick = ()=>{ if(!spritesReady) return; spriteMode=!spriteMode; bSprite.classList.toggle('on', spriteMode); };

function worldOrigin(){ return { ox: canvas.width/2 - cam.x*cam.zoom, oy: canvas.height/2 - cam.y*cam.zoom }; }

// ---- Drawing helpers ------------------------------------------------
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function hx2(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){ const pa=hx2(a),pb=hx2(b); return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`; }

function drawTile(col, row, sx, sy, z){
  const t = ground[row][col];
  if(spriteMode && spritesReady){
    const simg = IMG['t'+t];
    if(simg) ctx.drawImage(simg, sx - W/2, sy - H/2);
    const isH = hover && hover.col===col && hover.row===row;
    if(isH){ ctx.fillStyle='rgba(255,247,224,.38)'; ctx.beginPath();
      ctx.moveTo(sx,sy-H/2); ctx.lineTo(sx+W/2,sy); ctx.lineTo(sx,sy+H/2); ctx.lineTo(sx-W/2,sy); ctx.closePath(); ctx.fill(); }
    if(showGrid){ ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1; ctx.beginPath();
      ctx.moveTo(sx,sy-H/2); ctx.lineTo(sx+W/2,sy); ctx.lineTo(sx,sy+H/2); ctx.lineTo(sx-W/2,sy); ctx.closePath(); ctx.stroke(); }
    if(showCoords){ ctx.fillStyle='rgba(0,0,0,.6)'; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillText(col+','+row, sx, sy+3); }
    return;
  }
  const pal = TILE[t];
  let topColor = pal.top;
  if(t===0){ const a = 0.5 + 0.5*Math.sin(z*0.0025 + (col+row)); topColor = mix(pal.top, '#9fd0f0', a*0.4); }
  const hx=W/2, hy=H/2;
  ctx.fillStyle = pal.l;
  ctx.beginPath(); ctx.moveTo(sx-hx,sy); ctx.lineTo(sx,sy+hy); ctx.lineTo(sx,sy+hy+T); ctx.lineTo(sx-hx,sy+T); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.r;
  ctx.beginPath(); ctx.moveTo(sx+hx,sy); ctx.lineTo(sx,sy+hy); ctx.lineTo(sx,sy+hy+T); ctx.lineTo(sx+hx,sy+T); ctx.closePath(); ctx.fill();
  const isHover = hover && hover.col===col && hover.row===row;
  ctx.fillStyle = isHover ? '#fff7e0' : topColor;
  ctx.beginPath(); ctx.moveTo(sx,sy-hy); ctx.lineTo(sx+hx,sy); ctx.lineTo(sx,sy+hy); ctx.lineTo(sx-hx,sy); ctx.closePath(); ctx.fill();
  if(showGrid){ ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1; ctx.stroke(); }
  else { ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.stroke(); }
  if(showCoords){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(col+','+row, sx, sy+3); }
}
function drawObject(o, sx, sy){
  if(spriteMode && spritesReady){
    const key = o.kind==='tree' ? 'tree' : o.kind==='rock' ? 'rock' : 'house';
    const oimg = IMG[key];
    if(oimg){ ctx.drawImage(oimg, sx - oimg.width/2, sy - oimg.height + 10); return; }
  }
  if(o.kind==='tree'){
    ctx.fillStyle='#6b4a2b'; ctx.fillRect(sx-3, sy-14, 6, 16);
    ctx.fillStyle='#3f8f3a'; circle(sx, sy-26, 14);
    ctx.fillStyle='#54aa4c'; circle(sx-8, sy-18, 10); circle(sx+8, sy-18, 10);
  } else if(o.kind==='rock'){
    ctx.fillStyle='#8d9299'; circle(sx, sy-6, 10);
    ctx.fillStyle='#a7adb4'; circle(sx-4, sy-9, 6);
  } else {
    ctx.fillStyle='#caa15a'; ctx.fillRect(sx-16, sy-26, 32, 26);
    ctx.fillStyle='#a4632f'; ctx.beginPath(); ctx.moveTo(sx-20,sy-26); ctx.lineTo(sx,sy-44); ctx.lineTo(sx+20,sy-26); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#5a3b22'; ctx.fillRect(sx-5, sy-14, 10, 14);
  }
}

// ---- Main loop (skills: renderer + depth-sorting-occlusion) ---------
let frames=0, fpsT=performance.now(), fps=0;
generate();
function frame(now){
  const {ox, oy} = worldOrigin();
  const wx = (mouseX - ox)/cam.zoom, wy = (mouseY - oy)/cam.zoom;
  const g = screenToGrid(wx, wy);
  hover = (g.col>=0&&g.row>=0&&g.col<MAP&&g.row<MAP) ? g : null;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(cam.zoom,0,0,cam.zoom, ox, oy);
  ctx.textAlign='center';

  for(let s=0; s<=2*(MAP-1); s++){
    for(let row=0; row<MAP; row++){
      const col = s-row;
      if(col<0||col>=MAP) continue;
      const p = gridToScreen(col,row);
      drawTile(col,row,p.x,p.y,now);
      const o = objAt[row+'_'+col];
      if(o) drawObject(o, p.x, p.y);
    }
  }

  frames++;
  if(now-fpsT>500){ fps=Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
  document.getElementById('tile').textContent = hover ? `(${hover.col}, ${hover.row})` : '—';
  document.getElementById('zoom').textContent = cam.zoom.toFixed(2)+'x';
  document.getElementById('fps').textContent = fps;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
